<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Calculator</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #141e30, #243b55);
            font-family: Arial, sans-serif;
        }

        .calculator {
            width: 320px;
            max-width: calc(100vw - 30px);
            padding: 22px;
            background: #1f2937;
            border-radius: 20px;
            box-shadow: 0 10px 30px #0006;
        }

        h2 {
            text-align: center;
            color: white;
            margin-top: 0;
        }

        #display {
            width: 100%;
            height: 65px;
            margin-bottom: 18px;
            padding: 12px;
            border: none;
            border-radius: 10px;
            background: #f3f4f6;
            font-size: 27px;
            text-align: right;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        button {
            height: 55px;
            border: none;
            border-radius: 10px;
            font-size: 20px;
            cursor: pointer;
            background: #e5e7eb;
        }

        button:hover {
            opacity: 0.8;
        }

        .operator {
            background: #f59e0b;
            color: white;
        }

        .clear {
            background: #ef4444;
            color: white;
        }

        .equal {
            background: #10b981;
            color: white;
        }

        .zero {
            grid-column: span 2;
        }
    </style>
</head>

<body>
    <div class="calculator">
        <h2>Calculator</h2>

        <input type="text" id="display"
               placeholder="0" readonly
               aria-label="Calculator display">

        <div class="buttons">
            <button class="clear" onclick="clearDisplay()">AC</button>
            <button onclick="deleteLast()">DEL</button>
            <button class="operator" onclick="appendValue('%')">%</button>
            <button class="operator" onclick="appendValue('/')">÷</button>

            <button onclick="appendValue('7')">7</button>
            <button onclick="appendValue('8')">8</button>
            <button onclick="appendValue('9')">9</button>
            <button class="operator" onclick="appendValue('*')">×</button>

            <button onclick="appendValue('4')">4</button>
            <button onclick="appendValue('5')">5</button>
            <button onclick="appendValue('6')">6</button>
            <button class="operator" onclick="appendValue('-')">−</button>

            <button onclick="appendValue('1')">1</button>
            <button onclick="appendValue('2')">2</button>
            <button onclick="appendValue('3')">3</button>
            <button class="operator" onclick="appendValue('+')">+</button>

            <button class="zero" onclick="appendValue('0')">0</button>
            <button onclick="appendValue('.')">.</button>
            <button class="equal" onclick="calculate()">=</button>
        </div>
    </div>

    <script>
        // Add a number or operator to the display.
        function appendValue(value) {
            const display = document.getElementById("display");

            if (display.value === "Error") {
                display.value = "";
            }

            display.value += value;
        }

        // Clear the complete display.
        function clearDisplay() {
            document.getElementById("display").value = "";
        }

        // Delete the last entered character.
        function deleteLast() {
            const display = document.getElementById("display");
            display.value = display.value.slice(0, -1);
        }

        // Calculate the arithmetic expression.
        function calculate() {
            const display = document.getElementById("display");
            const expression = display.value;

            // Accept only numbers and arithmetic operators.
            if (!expression ||
                !/^[0-9+\-*/%.() ]+$/.test(expression)) {
                display.value = "Error";
                return;
            }

            try {
                // Evaluate the validated arithmetic expression.
                const result = Function(
                    '"use strict"; return (' + expression + ')'
                )();

                // Handle division by zero and invalid results.
                if (typeof result !== "number" ||
                    !Number.isFinite(result)) {
                    display.value = "Error";
                } else {
                    display.value = String(
                        Math.round(
                            (result + Number.EPSILON) * 1e10
                        ) / 1e10
                    );
                }
            } catch (error) {
                display.value = "Error";
            }
        }
    </script>
</body>
</html>
